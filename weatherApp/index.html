

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: linear-gradient(to right, #41382f, #99604f);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
      }

      .weather-card {
        width: 350px;
        border-radius: 20px;
        overflow: hidden;
      }

      .temp {
        font-size: 55px;
        font-weight: bold;
      }

      .weather-icon {
        font-size: 70px;
      }
    </style>
  </head>

  <body>
    <div class="card weather-card shadow-lg">
      <div class="card-body text-center p-4">
        <h2 class="mb-4 text-primary">🌦 Weather App</h2>

        <input
          type="text"
          id="cityInput"
          class="form-control"
          placeholder="Enter city"
        />

        <button class="btn btn-primary w-100 mt-3" onclick="getWeather()">
          Check Weather
        </button>

        <div class="mt-4">
          <div class="weather-icon"></div>

          <h3 id="cityName">Your City</h3>

          <div class="temp text-primary"><span id="temp">--</span>°C</div>

          <p id="weatherType" class="text-secondary">Weather Condition</p>

          <p>
            Humidity:
            <span id="humidity">--</span>%
          </p>

          <p>
            Wind Speed:
            <span id="wind">--</span> km/h
          </p>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
