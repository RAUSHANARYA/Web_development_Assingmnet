<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Currency Converter</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <style>
      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(to right, #141e30, #243b55);
        font-family: Arial, sans-serif;
      }

      .converter-card {
        width: 100%;
        max-width: 500px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(12px);
        color: white;
      }

      .flag {
        width: 35px;
        height: 25px;
        object-fit: cover;
        border-radius: 5px;
      }

      .swap-btn {
        width: 55px;
        height: 55px;
        border-radius: 50%;
        font-size: 22px;
      }

      .title {
        font-weight: bold;
        letter-spacing: 1px;
      }

      select,
      input {
        background: rgba(255, 255, 255, 0.2) !important;
        color: white !important;
        border: none !important;
      }

      select option {
        color: black;
      }

      input::placeholder {
        color: #ddd !important;
      }
    </style>
  </head>

  <body>
    <div class="card converter-card shadow-lg p-4">
      <h2 class="text-center mb-4 title">Currency Converter</h2>

      <div class="row align-items-center">
        <!-- FROM -->
        <div class="col-md-5 mb-3">
          <label class="mb-2">From</label>

          <div class="d-flex gap-2">
            <img
              src="https://flagsapi.com/US/flat/64.png"
              id="fromFlag"
              class="flag"
            />

            <select class="form-select" id="fromCurrency"></select>
          </div>
        </div>

        <!-- SWAP -->
        <div class="col-md-2 text-center mb-3">
          <button class="btn btn-light swap-btn" id="swapBtn">
            <i class="bi bi-arrow-left-right"></i>
          </button>
        </div>

        <!-- TO -->
        <div class="col-md-5 mb-3">
          <label class="mb-2">To</label>

          <div class="d-flex gap-2">
            <img
              src="https://flagsapi.com/IN/flat/64.png"
              id="toFlag"
              class="flag"
            />

            <select class="form-select" id="toCurrency"></select>
          </div>
        </div>
      </div>

      <!-- Amount -->
      <div class="mt-3">
        <label class="mb-2">Amount</label>

        <input
          type="number"
          class="form-control"
          id="amount"
          placeholder="Enter amount"
        />
      </div>

      <!-- Button -->
      <button class="btn btn-primary w-100 mt-4" id="convertBtn">
        Convert Currency
      </button>

      <hr class="text-light" />

      <!-- Result -->
      <div class="text-center">
        <h4 id="result">Converted Amount: --</h4>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
